# Solo compila y publica artefactos. No contiene credenciales ni despliega.
# En el Rocky Linux el frontend se publica bajo /sicol/, por eso se usa
# build:rocky y no se modifica la compilacion corporativa por defecto.
workflow:
  rules:
    - if: '$CI_COMMIT_TAG =~ /^\d+\.\d+\.\d+-test$/'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - when: never

stages:
  - build

frontend-build:
  stage: build
  image: node:22-bookworm
  interruptible: true
  variables:
    NPM_CONFIG_CACHE: "$CI_PROJECT_DIR/.npm"
    NODE_OPTIONS: "--max-old-space-size=2048"
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
  rules:
    - if: '$CI_COMMIT_TAG =~ /^\d+\.\d+\.\d+-test$/'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: manual
      allow_failure: true
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual
      allow_failure: true
  before_script:
    - node --version
    - npm --version
    - npm ci --cache .npm --prefer-offline
  script:
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        expected_tag="$(tr -d '\r\n' < VERSION)-test"
        test "$CI_COMMIT_TAG" = "$expected_tag"
      fi
    - npm run check:version
    - npm run build:rocky
    - mkdir -p artifacts
    - tar -C dist/tfm-iaap-frontend-administracion/browser -czf artifacts/sicol-frontend-administracion.tar.gz .
    - sha256sum artifacts/sicol-frontend-administracion.tar.gz > artifacts/sicol-frontend-administracion.tar.gz.sha256
  artifacts:
    name: "sicol-frontend-$CI_COMMIT_REF_SLUG"
    expire_in: 90 days
    paths:
      - artifacts/sicol-frontend-administracion.tar.gz
      - artifacts/sicol-frontend-administracion.tar.gz.sha256
