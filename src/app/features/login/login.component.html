<section class="login-page" aria-labelledby="login-title">
  <form class="login-panel" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <div class="login-heading">
      <span class="login-kicker">Backoffice</span>
      <h1 id="login-title">SICOL Administración</h1>
    </div>
    <p class="required-note">* Campos obligatorios</p>

    @if (error()) {
      <div class="alert alert--error" role="alert">{{ error() }}</div>
    }

    <div class="field">
      <label for="usuario">Usuario *</label>
      <input
        id="usuario"
        type="text"
        autocomplete="username"
        formControlName="usuario"
        [attr.aria-invalid]="form.controls.usuario.invalid && form.controls.usuario.touched"
      >
      @if (form.controls.usuario.invalid && form.controls.usuario.touched) {
        <span class="field-error">Introduce el usuario.</span>
      }
    </div>

    <div class="field">
      <label for="password">Contraseña *</label>
      <div class="password-field">
        <input
          id="password"
          [type]="passwordType()"
          autocomplete="current-password"
          formControlName="password"
          [attr.aria-invalid]="form.controls.password.invalid && form.controls.password.touched"
        >
        <button
          class="password-toggle"
          type="button"
          [attr.aria-pressed]="showPassword()"
          [attr.aria-label]="showPassword() ? 'Ocultar contraseña' : 'Mostrar contraseña'"
          [attr.title]="showPassword() ? 'Ocultar contraseña' : 'Mostrar contraseña'"
          (click)="showPassword.set(!showPassword())"
        >
          <i [class]="showPassword() ? 'fa fa-eye-slash' : 'fa fa-eye'" aria-hidden="true"></i>
        </button>
      </div>
      @if (form.controls.password.invalid && form.controls.password.touched) {
        <span class="field-error">Introduce la contraseña.</span>
      }
    </div>

    <div class="form-actions">
      <button class="button button--primary" type="submit" [disabled]="submitting()">
        {{ submitting() ? "Accediendo..." : "Acceder" }}
      </button>
    </div>
  </form>
</section>
