<header class="app-header">
  <div class="app-header__inner">
    <a class="brand" routerLink="/admin" aria-label="Ir al inicio de SICOL" (click)="closeMenu()">
      <span class="brand__mark" aria-hidden="true">JA</span>
      <span>
        <strong>Junta de Andalucía</strong>
        <span>SICOL Administración</span>
      </span>
    </a>

    @if (isAuthenticated()) {
      <button
        class="menu-toggle"
        type="button"
        (click)="toggleMenu()"
        [attr.aria-expanded]="menuOpen()"
        aria-controls="main-navigation"
      >
        <span class="menu-toggle__icon" aria-hidden="true"></span>
        Menú
      </button>

      <div class="nav-panel" [class.is-open]="menuOpen()">
        <nav id="main-navigation" class="app-nav" aria-label="Navegación principal">
          <a class="nav-item" routerLink="/admin" routerLinkActive="is-active" [routerLinkActiveOptions]="{ exact: true }" (click)="closeMenu()">
            <span class="nav-icon nav-icon--home" aria-hidden="true"></span>
            <span>Inicio</span>
          </a>
          <a class="nav-item" routerLink="/admin/colaboradores" routerLinkActive="is-active" (click)="closeMenu()">
            <span class="nav-icon nav-icon--users" aria-hidden="true"></span>
            <span>Colaboradores</span>
          </a>
          <a class="nav-item" routerLink="/admin/procesos" routerLinkActive="is-active" (click)="closeMenu()">
            <span class="nav-icon nav-icon--process" aria-hidden="true"></span>
            <span>Procesos</span>
          </a>
          <a class="nav-item" routerLink="/admin/importaciones" routerLinkActive="is-active" (click)="closeMenu()">
            <span class="nav-icon nav-icon--upload" aria-hidden="true"></span>
            <span>Importaciones</span>
          </a>
          <a class="nav-item" routerLink="/admin/perfiles" routerLinkActive="is-active" (click)="closeMenu()">
            <span class="nav-icon nav-icon--profiles" aria-hidden="true"></span>
            <span>Perfiles</span>
          </a>
          <a class="nav-item" routerLink="/admin/asignaciones" routerLinkActive="is-active" (click)="closeMenu()">
            <span class="nav-icon nav-icon--assignment" aria-hidden="true"></span>
            <span>Asignaciones</span>
          </a>
          <a class="nav-item" routerLink="/admin/control" routerLinkActive="is-active" (click)="closeMenu()">
            <span class="nav-icon nav-icon--control" aria-hidden="true"></span>
            <span>Control</span>
          </a>
          <a class="nav-item" routerLink="/admin/firmas" routerLinkActive="is-active" (click)="closeMenu()">
            <span class="nav-icon nav-icon--sign" aria-hidden="true"></span>
            <span>Firmas</span>
          </a>
          <a class="nav-item" routerLink="/admin/pagos" routerLinkActive="is-active" (click)="closeMenu()">
            <span class="nav-icon nav-icon--payments" aria-hidden="true"></span>
            <span>Pagos</span>
          </a>
        </nav>

        <div class="session">
          <span>{{ user()?.nombreCompleto || user()?.login }}</span>
          <button class="button button--secondary" type="button" (click)="logout()">Cerrar sesión</button>
        </div>
      </div>
    }
  </div>
</header>

<main class="app-main">
  <router-outlet />
</main>

<footer class="app-footer">
  <div class="app-footer__inner">
    <span>Instituto Andaluz de Administración Pública</span>
    <span>Sistema IAAP de Colaboradores</span>
  </div>
</footer>
